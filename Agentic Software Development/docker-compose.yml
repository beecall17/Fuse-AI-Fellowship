services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}
    container_name: ${POSTGRES_CONTAINER_NAME:-classicmodels_db}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abcd}
      POSTGRES_USER: ${POSTGRES_USER:-abcd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abcd}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abcd} -d ${POSTGRES_DB:-abcd}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge